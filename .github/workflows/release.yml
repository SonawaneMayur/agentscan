name: Release

# Publishes to PyPI when a version tag (e.g. v0.1.0) is pushed. Uses PyPI Trusted Publishing,
# so no API token is stored in the repo; PyPI must list this workflow as a trusted publisher.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Check tag matches package version
        run: |
          version=$(uv run python -c "import agentscan; print(agentscan.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: uv run pytest
      - run: uv build
      - name: Refuse to publish research data, notebooks or local files
        run: |
          if tar tzf dist/*.tar.gz | grep -E '/(research|notebooks|data|scripts|\.githooks)/|\.(db|env|csv)$'; then
            echo "Unexpected files in the source distribution" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentscan-si/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
